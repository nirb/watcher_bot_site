<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    
    <title>bejbot</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-attachment: fixed;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 2rem;
            animation: fadeInDown 1s ease-out;
        }
        
        header h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: var(--card-shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .glass:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.45);
        }
        
        .main-card {
            text-align: center;
            padding: 1rem;
            animation: fadeInUp 1s ease-out;
            margin-bottom: 1rem;
        }
        
        .total-section {
            margin-bottom: 1rem;
        }
        
        .total-section h2 {
            font-size: 1.5rem;
            font-weight: 400;
            color: #94a3b8;
            margin-bottom: 1rem;
        }
        
        .total-section .value {
            font-size: 4rem;
            font-weight: 800;
            color: var(--accent-color);
        }
        
        .info-btn {
            cursor: pointer;
            color: #94a3b8;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            vertical-align: middle;
            margin-left: 0.75rem;
        }
        
        .info-btn:hover {
            color: var(--accent-color);
            background: rgba(56, 189, 248, 0.15);
            border-color: var(--accent-color);
            transform: scale(1.1);
        }
        
        .allocations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--glass-border);
        }
        
        .alloc-item {
            background: rgba(0,0,0,0.2);
            padding: 1.5rem;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }
        
        .alloc-curr {
            font-size: 1.2rem;
            color: #cbd5e1;
        }
        
        .alloc-val {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--text-color);
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            animation: fadeInUp 1.4s ease-out;
        }
        
        .list-section h3 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: #38bdf8;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 0.5rem;
        }
        
        .bar-chart {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            height: 250px;
            padding-top: 2rem;
        }
        
        .bar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
            flex: 1;
            margin: 0 5px;
        }
        
        .bar {
            width: 100%;
            max-width: 50px;
            background: linear-gradient(to top, #0284c7, #38bdf8);
            border-radius: 6px 6px 0 0;
            margin-top: 10px;
            margin-bottom: 10px;
            transition: height 0.5s ease;
        }
        
        .bar-val {
            font-size: 0.95rem;
            color: var(--text-color);
            font-weight: 600;
        }
        
        .bar-label {
            font-size: 0.9rem;
            color: #cbd5e1;
            white-space: nowrap;
        }
        
        .perf-chart {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            height: 250px;
            padding-top: 2rem;
            overflow-x: auto;
            gap: 10px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.2) rgba(255, 255, 255, 0.05);
        }
        
        .perf-chart::-webkit-scrollbar {
            height: 6px;
        }
        
        .perf-chart::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }
        
        .perf-chart::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
        
        .perf-chart::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .perf-bar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
            flex: 1;
            min-width: 50px;
        }
        
        .perf-bar {
            width: 100%;
            max-width: 40px;
            background: linear-gradient(to top, #6366f1, #a5b4fc);
            border-radius: 6px 6px 0 0;
            margin-top: 10px;
            margin-bottom: 10px;
            transition: height 0.5s ease;
            position: relative;
        }
        
        .perf-bar:hover {
            background: linear-gradient(to top, #4f46e5, #c7d2fe);
            transform: scaleY(1.05);
        }
        
        .perf-val {
            font-size: 0.85rem;
            color: var(--text-color);
            font-weight: 600;
            white-space: nowrap;
        }
        
        .perf-label {
            font-size: 0.9rem;
            color: #cbd5e1;
            white-space: nowrap;
        }
        
        .perf-hint {
            display: none;
        }
        
        .events-hint {
            display: block;
            text-align: center;
            font-size: 0.95rem;
            color: var(--accent-color);
            margin-top: 1rem;
            cursor: pointer;
            opacity: 0.8;
            font-weight: 600;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        
        .events-hint:hover {
            opacity: 1;
            transform: scale(1.02);
        }
        
        .rate-row {
            display: flex;
            justify-content: space-between;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .rate-row:last-child {
            border-bottom: none;
        }
        
        .rate-curr, .rate-val {
            font-size: 1.5rem;
            font-weight: 600;
        }
        .rate-curr {
            color: #cbd5e1;
        }
        
        .rate-val {
            color: var(--text-color);
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        
        .data-table th, .data-table td {
            padding: 0.85rem 0.5rem;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .data-table th {
            color: var(--accent-color);
            font-weight: 600;
            font-size: 1.05rem;
        }
        
        .data-table td {
            font-size: 1rem;
            color: var(--text-color);
        }
        
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .top-bar {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-bottom: 0rem;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 1rem;
            animation: fadeInDown 1s ease-out;
        }
        
        .portfolio-title-wrapper {
            display: inline-block;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        
        .portfolio-title-wrapper:hover {
            transform: scale(1.03);
            opacity: 0.9;
        }

        .search-menu-panel {
            width: 100%;
            margin-bottom: 2rem;
            padding: 1.5rem;
            animation: fadeInDown 0.3s ease-out;
            display: none;
            flex-direction: column;
            gap: 1rem;
        }
        
        .search-menu-header {
            display: flex;
            gap: 1rem;
            width: 100%;
        }
        
        #watcher-search-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }
        
        #watcher-search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }
        
        .watchers-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(to right, #38bdf8, #6366f1);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0.75rem 1.25rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2);
            white-space: nowrap;
        }
        
        .watchers-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
            background: linear-gradient(to right, #0ea5e9, #4f46e5);
        }
        
        .watchers-btn-icon {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            object-fit: cover;
        }
        
        .search-results-container {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
        }
        
        .search-result-item {
            padding: 0.85rem 1.25rem;
            color: var(--text-color);
            cursor: pointer;
            transition: background 0.2s ease;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .search-result-item:last-child {
            border-bottom: none;
        }
        
        .search-result-item:hover {
            background: rgba(56, 189, 248, 0.15);
        }
        
        .search-result-name {
            font-weight: 500;
        }
        
        .search-result-type {
            font-size: 0.85rem;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
        }

        @media (max-width: 480px) {
            .search-menu-header {
                flex-direction: column;
            }
            .watchers-btn {
                justify-content: center;
            }
        }
        
        .last-updated {
            position: absolute;
            left: 0;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.6rem;
            font-size: 1rem;
            color: #38bdf8;
            font-weight: 500;
        }
        
        .top-rates {
            color: #38bdf8;
            font-weight: 500;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #38bdf8;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #38bdf8;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(56, 189, 248, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
        }
        
        @media (max-width: 768px) {
            body { padding: 0.75rem; }
            .container { gap: 1rem; }
            .glass { padding: 1rem; }
            
            .top-bar {
                flex-direction: column;
                gap: 0.75rem;
                align-items: center;
                text-align: center;
                padding-bottom: 0.5rem;
            }
            .last-updated {
                position: static;
                justify-content: center;
            }
            
            .main-card {
                padding: 1.5rem 1rem;
                margin-bottom: 1rem;
            }
            .total-section {
                margin-bottom: 1rem;
            }
            .total-section .value {
                font-size: 2.5rem;
            }
            .allocations-grid {
                padding-top: 1rem;
                gap: 0.75rem;
                grid-template-columns: 1fr;
            }
            .alloc-item {
                padding: 1rem;
                gap: 0.25rem;
            }
            .alloc-curr {
                font-size: 1rem;
            }
            .alloc-val {
                font-size: 1.4rem;
            }
            
            .info-grid {
                gap: 1rem;
            }
            
            .list-section h3 {
                font-size: 1.2rem;
                margin-bottom: 1rem;
            }
            .list-section {
                margin-bottom: 1rem !important;
            }
            .message-section {
                margin-top: 1rem !important;
            }
            
            .bar-chart {
                padding-top: 1rem;
            }
            .bar { max-width: 30px; }
            .bar-val { font-size: 0.8rem; }
            .bar-label { font-size: 0.8rem; }
            
            .perf-chart {
                justify-content: space-between;
                padding-top: 1rem;
                padding-bottom: 10px;
                cursor: pointer;
            }
            .perf-chart.expanded {
                justify-content: flex-start;
            }
            .perf-chart:not(.expanded) .perf-bar-wrapper:nth-last-child(n+5) {
                display: none;
            }
            .perf-bar-wrapper {
                flex: 1;
                min-width: 50px;
            }
            .perf-chart.expanded .perf-bar-wrapper {
                flex: 0 0 70px;
            }
            .perf-val {
                font-size: 0.8rem;
            }
            .perf-label {
                font-size: 0.8rem;
            }
            .perf-hint {
                display: block;
                text-align: center;
                font-size: 0.85rem;
                color: var(--accent-color);
                margin-top: 0.75rem;
                cursor: pointer;
                opacity: 0.8;
                font-weight: 600;
                transition: opacity 0.2s ease, transform 0.2s ease;
            }
            .perf-hint:hover {
                opacity: 1;
                transform: scale(1.02);
            }
            .perf-hint::after {
                content: "📊 Tap to show 12 months performance";
            }
            .perf-chart.expanded ~ .perf-hint::after {
                content: "📊 Tap to show less";
            }
            
            .data-table th, .data-table td {
                padding: 0.5rem 0.25rem;
                font-size: 0.9rem;
            }
        }

        /* Login Screen CSS Rules */
        @keyframes loginFadeIn {
            from { opacity: 0; transform: translate(-50%, -50%) translateY(20px); }
            to { opacity: 1; transform: translate(-50%, -50%) translateY(0); }
        }

        #login-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 400px;
            width: 90%;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            animation: loginFadeIn 0.8s ease-out;
            z-index: 1000;
        }
        
        .login-header {
            margin-bottom: 2rem;
        }
        
        .login-logo {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            margin-bottom: 1.5rem;
            object-fit: cover;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        
        .login-header h2 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        
        .login-header p {
            color: #94a3b8;
            font-size: 0.95rem;
        }
        
        .input-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        #password-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1rem;
            color: var(--text-color);
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        #password-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }
        
        #login-btn {
            background: linear-gradient(to right, #38bdf8, #6366f1);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }
        
        #login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
            background: linear-gradient(to right, #0ea5e9, #4f46e5);
        }
        
        .error-msg {
            color: #ef4444;
            font-size: 0.95rem;
            margin-top: 1rem;
            min-height: 1.2rem;
            font-weight: 600;
        }
        
        .install-btn {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            border-radius: 12px;
            padding: 0.75rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: all 0.3s ease;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .install-btn:hover {
            background: rgba(56, 189, 248, 0.25);
            transform: translateY(-1px);
        }
        
        #install-btn-dashboard {
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            margin-top: 0;
            margin-left: 1rem;
            vertical-align: middle;
        }
        
        .shake {
            animation: shake 0.4s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translate(-50%, -50%); }
            15%, 45%, 75% { transform: translate(-50%, -50%) translateX(-8px); }
            30%, 60%, 90% { transform: translate(-50%, -50%) translateX(8px); }
        }
    </style>
</head>
<body>
    <div id="login-container" class="glass">
        <div class="login-header">
            <img id="app-logo" src="icon-192.png" alt="App Icon" class="login-logo">
            <h2>Portfolio Overview</h2>
            <p>Please enter password to unlock dashboard</p>
        </div>
        <div class="input-group">
            <input type="password" id="password-input" placeholder="Password">
            <button id="login-btn" onclick="attemptLogin()">Unlock</button>
            <button id="install-btn-login" class="install-btn" style="display: none;" onclick="triggerInstall()">📥 Install App</button>
        </div>
        <div id="login-error" class="error-msg"></div>
    </div>

        // RC4 Decryption Helpers
        function base64ToBytes(base64) {
            const binString = atob(base64);
            const len = binString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binString.charCodeAt(i);
            }
            return bytes;
        }

        function rc4DecryptBytes(keyStr, encryptedBytes) {
            const keyBytes = new TextEncoder().encode(keyStr);
            const s = new Uint8Array(256);
            for (let k = 0; k < 256; k++) {
                s[k] = k;
            }
            let j = 0;
            for (let k = 0; k < 256; k++) {
                j = (j + s[k] + keyBytes[k % keyBytes.length]) % 256;
                const temp = s[k];
                s[k] = s[j];
                s[j] = temp;
            }
            let i = 0;
            j = 0;
            const decryptedBytes = new Uint8Array(encryptedBytes.length);
            for (let y = 0; y < encryptedBytes.length; y++) {
                i = (i + 1) % 256;
                j = (j + s[i]) % 256;
                const temp = s[i];
                s[i] = s[j];
                s[j] = temp;
                decryptedBytes[y] = encryptedBytes[y] ^ s[(s[i] + s[j]) % 256];
            }
            return decryptedBytes;
        }

        function decryptAndRender(password) {
            try {
                const encryptedBytes = base64ToBytes(window.encryptedPayload);
                const decryptedBytes = rc4DecryptBytes(password, encryptedBytes);
                const decryptedHTML = new TextDecoder().decode(decryptedBytes);
                
                if (decryptedHTML.startsWith('<div class="container">')) {
                    sessionStorage.setItem('decrypt_key', password);
                    const appContainer = document.getElementById('app-container');
                    appContainer.innerHTML = decryptedHTML;
                    initEvents();
                    
                    // Format last updated time to local timezone
                    const lastUpdatedEl = document.getElementById('last-updated-time');
                    if (lastUpdatedEl) {
                        const utcStr = lastUpdatedEl.getAttribute('data-timestamp');
                        if (utcStr) {
                            const date = new Date(utcStr);
                            const day = String(date.getDate()).padStart(2, '0');
                            const month = String(date.getMonth() + 1).padStart(2, '0');
                            const year = String(date.getFullYear()).slice(-2);
                            const hours = String(date.getHours()).padStart(2, '0');
                            const minutes = String(date.getMinutes()).padStart(2, '0');
                            lastUpdatedEl.textContent = `${day}/${month}/${year} ${hours}:${minutes}`;
                        }
                    }

                    appContainer.style.display = 'flex';
                    document.getElementById('login-container').style.display = 'none';
                    resetActivityTimer();
                    
                    // Re-show install dashboard button if prompt is active
                    if (deferredPrompt) {
                        const btnDash = document.getElementById('install-btn-dashboard');
                        if (btnDash) btnDash.style.display = 'inline-flex';
                    }
                    return true;
                }
            } catch (e) {
                console.error('Decryption error:', e);
            }
            return false;
        }

        function attemptLogin() {
            const pwdInput = document.getElementById('password-input');
            const errorMsg = document.getElementById('login-error');
            const loginCard = document.getElementById('login-container');
            const password = pwdInput.value;
            
            if (decryptAndRender(password)) {
                errorMsg.textContent = '';
            } else {
                errorMsg.textContent = 'Incorrect password.';
                loginCard.classList.remove('shake');
                // trigger reflow to restart animation
                void loginCard.offsetWidth;
                loginCard.classList.add('shake');
            }
        }

        let currentEventsFilter = 'last5';
        
        function initEvents() {
            const eventsDataEl = document.getElementById('events-menu-data');
            if (eventsDataEl) {
                try {
                    window.allEvents = JSON.parse(eventsDataEl.getAttribute('data-events'));
                } catch (e) {
                    console.error('Error parsing events:', e);
                }
            }
            renderEvents();
        }
        
        function renderEvents() {
            const container = document.getElementById('events-table-container');
            const hint = document.getElementById('events-hint');
            if (!container || !hint || !window.allEvents) return;
            
            let filtered = [];
            let hintText = '';
            
            if (currentEventsFilter === 'last5') {
                filtered = window.allEvents.slice(0, 5);
                hintText = "📅 Showing last 5 events. Click to show last month's events.";
            } else if (currentEventsFilter === 'month') {
                const cutoff = new Date();
                cutoff.setMonth(cutoff.getMonth() - 1);
                filtered = window.allEvents.filter(e => new Date(e.date) >= cutoff);
                hintText = "📅 Showing last month's events. Click to show last 3 months' events.";
            } else if (currentEventsFilter === '3months') {
                const cutoff = new Date();
                cutoff.setMonth(cutoff.getMonth() - 3);
                filtered = window.allEvents.filter(e => new Date(e.date) >= cutoff);
                hintText = "📅 Showing last 3 months' events. Click to show last 5 events.";
            }
            
            hint.textContent = hintText;
            
            if (filtered.length === 0) {
                container.innerHTML = `<table class="data-table">
                    <thead>
                        <tr>
                            <th style="text-align: left;">Date & Time</th>
                            <th style="text-align: left;">Watcher</th>
                            <th>Type</th>
                            <th style="text-align: right;">Value</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="4" style="text-align: center; color: #94a3b8; padding: 1.5rem;">No events found for this period</td>
                        </tr>
                    </tbody>
                </table>`;
                return;
            }
            
            let htmlStr = `<table class="data-table">
                <thead>
                    <tr>
                        <th style="text-align: left;">Date & Time</th>
                        <th style="text-align: left;">Watcher</th>
                        <th>Type</th>
                        <th style="text-align: right;">Value</th>
                    </tr>
                </thead>
                <tbody>`;
                
            filtered.forEach(e => {
                const formattedDate = formatEventDate(e.date);
                const formattedValue = formatEventValue(e.value, e.sym);
                const valColor = e.value > 0 ? '#22c55e' : (e.value < 0 ? '#ef4444' : '#f8fafc');
                htmlStr += `<tr>
                    <td style="text-align: left; color: #94a3b8;">${formattedDate}</td>
                    <td style="text-align: left; font-weight: 500;" dir="auto">${e.watcher}</td>
                    <td>${e.type}</td>
                    <td style="text-align: right; color: ${valColor}; font-weight: 600;">${formattedValue}</td>
                </tr>`;
            });
            
            htmlStr += `</tbody></table>`;
            container.innerHTML = htmlStr;
        }
        
        function cycleEventsFilter() {
            if (currentEventsFilter === 'last5') {
                currentEventsFilter = 'month';
            } else if (currentEventsFilter === 'month') {
                currentEventsFilter = '3months';
            } else {
                currentEventsFilter = 'last5';
            }
            renderEvents();
        }
        
        function formatEventDate(dateStr) {
            if (!dateStr) return "-";
            const date = new Date(dateStr);
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = String(date.getFullYear()).slice(-2);
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${day}/${month}/${year} ${hours}:${minutes}`;
        }
        
        function formatEventValue(val, sym) {
            if (val === 0) return "-";
            const prefix = val < 0 ? "-" : "";
            const absVal = Math.abs(val);
            if (absVal % 1 !== 0) {
                return prefix + sym + absVal.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
            }
            return prefix + sym + Math.round(absVal).toLocaleString();
        }

        function handleSearch(query) {
            const resultsContainer = document.getElementById('search-results-list');
            if (!resultsContainer) return;
            
            if (!query || !query.trim()) {
                resultsContainer.innerHTML = '';
                resultsContainer.style.display = 'none';
                return;
            }
            
            // Get watchers data from the data attribute if not already cached
            if (!window.watchersData) {
                const searchMenu = document.getElementById('search-menu-container');
                if (searchMenu) {
                    const dataStr = searchMenu.getAttribute('data-watchers');
                    if (dataStr) {
                        try {
                            window.watchersData = JSON.parse(dataStr);
                        } catch (e) {
                            console.error('Error parsing watchers data:', e);
                        }
                    }
                }
            }
            
            const list = window.watchersData || [];
            const term = query.toLowerCase().trim();
            const filtered = list.filter(w => w.name.toLowerCase().includes(term) || w.type.toLowerCase().includes(term));
            
            if (filtered.length === 0) {
                resultsContainer.innerHTML = '<div style="padding: 1rem; color: #94a3b8; text-align: center;">No matches found</div>';
                resultsContainer.style.display = 'block';
                return;
            }
            
            let htmlStr = '';
            filtered.forEach(w => {
                htmlStr += `<div class="search-result-item" onclick="location.href='https://bejeranofin.com/watcher/${w.id}/'">
                    <span class="search-result-name">${w.name}</span>
                    <span class="search-result-type">${w.type}</span>
                </div>`;
            });
            
            resultsContainer.innerHTML = htmlStr;
            resultsContainer.style.display = 'block';
        }

        // Inactivity Locking (1 hour)
        let lastActivity = Date.now();
        const TIMEOUT_MS = 60 * 60 * 1000; // 1 hour

        function resetActivityTimer() {
            lastActivity = Date.now();
            sessionStorage.setItem('lastActivity', lastActivity);
        }

        ['mousedown', 'mousemove', 'keypress', 'scroll', 'touchstart'].forEach(evt => {
            window.addEventListener(evt, resetActivityTimer, { passive: true });
        });

        setInterval(() => {
            const cachedKey = sessionStorage.getItem('decrypt_key');
            if (cachedKey) {
                const storedLastActivity = parseInt(sessionStorage.getItem('lastActivity') || Date.now());
                if (Date.now() - storedLastActivity > TIMEOUT_MS) {
                    lockApp();
                }
            }
        }, 5000);

        function lockApp() {
            sessionStorage.removeItem('decrypt_key');
            const appContainer = document.getElementById('app-container');
            appContainer.style.display = 'none';
            appContainer.innerHTML = '';
            document.getElementById('login-container').style.display = 'flex';
            const pwdInput = document.getElementById('password-input');
            if (pwdInput) {
                pwdInput.value = '';
                pwdInput.focus();
            }
            const errorMsg = document.getElementById('login-error');
            if (errorMsg) {
                errorMsg.textContent = 'Session expired due to inactivity.';
                errorMsg.style.color = '#38bdf8';
            }
        }

        // Auto-login on load if valid session exists
        window.addEventListener('DOMContentLoaded', () => {
            const pwdInput = document.getElementById('password-input');
            if (pwdInput) {
                // Bind enter key
                pwdInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') attemptLogin();
                });

                // Auto-login on password change/input
                pwdInput.addEventListener('input', (e) => {
                    const password = e.target.value;
                    const errorMsg = document.getElementById('login-error');
                    if (errorMsg) errorMsg.textContent = '';
                    if (password) {
                        decryptAndRender(password);
                    }
                });
            }

            const cachedKey = sessionStorage.getItem('decrypt_key');
            const storedLastActivity = sessionStorage.getItem('lastActivity');
            if (cachedKey && storedLastActivity) {
                const timeDiff = Date.now() - parseInt(storedLastActivity);
                if (timeDiff < TIMEOUT_MS) {
                    if (decryptAndRender(cachedKey)) {
                        return;
                    }
                }
            }
            document.getElementById('login-container').style.display = 'flex';
            if (pwdInput) {
                pwdInput.focus();
            }
        });
    </script>
</body>
</html>
