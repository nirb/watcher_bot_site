        function base64ToBytes(base64) {
            const binString = atob(base64);
            const len = binString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binString.charCodeAt(i);
            }
            return bytes;
        }

        function rc4DecryptBytes(keyStr, encryptedBytes) {
            const keyBytes = new TextEncoder().encode(keyStr);
            const s = new Uint8Array(256);
            for (let k = 0; k < 256; k++) {
                s[k] = k;
            }
            let j = 0;
            for (let k = 0; k < 256; k++) {
                j = (j + s[k] + keyBytes[k % keyBytes.length]) % 256;
                const temp = s[k];
                s[k] = s[j];
                s[j] = temp;
            }
            let i = 0;
            j = 0;
            const decryptedBytes = new Uint8Array(encryptedBytes.length);
            for (let y = 0; y < encryptedBytes.length; y++) {
                i = (i + 1) % 256;
                j = (j + s[i]) % 256;
                const temp = s[i];
                s[i] = s[j];
                s[j] = temp;
                decryptedBytes[y] = encryptedBytes[y] ^ s[(s[i] + s[j]) % 256];
            }
            return decryptedBytes;
        }

        function decryptAndRender(password) {
            try {
                let basePassword = password;
                const match = password.match(/^(.+?)([1-7])$/);
                if (match) {
                    basePassword = match[1];
                }
                
                const encryptedBytes = base64ToBytes(window.encryptedPayload);
                const decryptedBytes = rc4DecryptBytes(basePassword, encryptedBytes);
                const decryptedHTML = new TextDecoder().decode(decryptedBytes);
                
                if (decryptedHTML.startsWith('<!DOCTYPE html>') || decryptedHTML.startsWith('<html>') || decryptedHTML.includes('<body')) {
                    document.getElementById('login-container').style.display = 'none';
                    document.body.style.display = 'block';
                    document.body.style.backgroundColor = 'transparent';
                    document.body.style.padding = '0';
                    const container = document.getElementById('report-container');
                    container.style.display = 'block';
                    container.innerHTML = decryptedHTML;
                    
                    const scripts = container.getElementsByTagName('script');
                    for (let s of scripts) {
                        const newScript = document.createElement('script');
                        newScript.text = s.text;
                        s.parentNode.replaceChild(newScript, s);
                    }
                    return true;
                }
            } catch (e) {
                console.error(e);
            }
            return false;
        }

        function handleLogin() {
            const pwd = document.getElementById('password-input').value;
            if (decryptAndRender(pwd)) {
                window.location.hash = pwd;
            } else {
                document.getElementById('error-msg').innerText = 'סיסמה שגויה';
            }
        }

        const hash = window.location.hash.substring(1);
        if (hash) {
            if (!decryptAndRender(hash)) {
                document.getElementById('error-msg').innerText = 'סיסמה שגויה בקישור';
            }
        }
    </script>
